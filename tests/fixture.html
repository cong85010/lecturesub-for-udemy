<!doctype html>
<html lang="vi"><meta charset="utf-8"><title>CC Udemy — trang kiểm thử mô phỏng</title>
<style>
  * {box-sizing:border-box} body {margin:0;background:#171719;color:#f7f7f9;font-family:Arial,sans-serif}
  header {padding:22px 32px;border-bottom:1px solid #414149;font-size:19px}
  main {max-width:1180px;margin:26px auto;padding:0 20px}
  [data-purpose="video-player"] {position:relative;aspect-ratio:16/9;background:#383047;overflow:hidden}
  video {width:100%;height:100%;display:block}
  .lesson {position:absolute;inset:18% 8% auto;pointer-events:none}
  .lesson h1 {font-size:clamp(24px,4vw,48px);font-weight:500;margin:0 0 30px}
  .lesson p {font-size:clamp(18px,2vw,27px);line-height:1.5;color:#e4ddef}
  .captions-display-module--captions-container--fixture {position:absolute;bottom:65px;width:100%;text-align:center}
  .captions-display-module--captions-cue-text--fixture {display:inline-block;background:#000b;padding:8px;font-size:22px}
  .note {font-size:14px;color:#c4bacf;line-height:1.6}
</style>
<header>Generative AI for JavaScript Developers</header>
<main>
  <div data-purpose="video-player"><video></video>
    <div class="lesson"><h1>Learning from data</h1><p>Data → Learning algorithm → Model</p></div>
    <div class="captions-display-module--captions-container--fixture"><div class="captions-display-module--captions-cue-text--fixture" data-test-cue>A model learns patterns from data.</div></div>
  </div>
  <p class="note">Trang kiểm thử mô phỏng — không phải Udemy thật. Bản dịch trong kiểm thử được cung cấp bởi fixture.</p>
</main></html>
